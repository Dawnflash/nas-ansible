- name: Ensure ZFS pool is available
  shell: modprobe zfs && zpool import -fa
  register: ensure_zfs
  changed_when: ensure_zfs.stderr != "no pools available to import"

- name: Create zfs-mount drop-in directory
  file:
    path: /etc/systemd/system/zfs-mount.service.d
    state: directory

# Overrides the default zfs-mount service to add the -l flag, making it load
# keys for encrypted datasets and mount them too.
- name: Configure zfs-mount to load encryption keys on boot
  copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/zfs mount -a -l
    dest: /etc/systemd/system/zfs-mount.service.d/load-keys.conf
  notify:
    - Reload systemd

# Overrides sanoid's systemd service to make it run with local time. UTC would
# be used without this and the timing would shift with DST changes.
- block:
    - name: Create sanoid drop-in directories
      file:
        path: /etc/systemd/system/{{ item }}.d
        state: directory
      loop: "{{ sanoid_units }}"

    - name: Run sanoid in local time
      copy:
        content: |
          [Service]
          Environment=TZ={{ timezone }}
        dest: /etc/systemd/system/{{ item }}.d/timezone.conf
      loop: "{{ sanoid_units }}"
      notify:
        - Reload systemd

  vars:
    sanoid_units:
      - sanoid.service
      - sanoid-prune.service

- name: Create sanoid config directory
  file:
    path: /etc/sanoid
    state: directory

- name: Configure sanoid
  template:
    src: sanoid.conf
    dest: /etc/sanoid/sanoid.conf

- name: Start sanoid
  systemd:
    name: sanoid.timer
    enabled: true
    state: started

- name: Validate presence of mounted ZFS datasets
  shell: zfs list -Ho mounted | grep yes
  register: zfs_mount_check
  changed_when: false
  failed_when: zfs_mount_check.stdout_lines | length <= samba_shares | length

- name: Fetch ZFS datasets
  command: zfs list -Ho name
  register: zfs_datasets
  changed_when: false

- name: Validate presence of Samba shares
  fail:
    msg: "{{ item.name }} share not present!"
  when: "[zpool_name, item.name] | join('/') not in zfs_datasets.stdout_lines"
  loop: "{{ samba_shares }}"

- name: Run Samba role
  include_role:
    name: bertvv.samba

- name: Create SSD storage root
  file:
    path: "{{ ssd_storage.root }}"
    state: directory

- name: Create root SSD storage subdirectories
  file:
    path: "{{ ssd_storage.root }}/{{ item }}"
    state: directory
  loop: "{{ ssd_storage.root_dirs }}"

- name: Create unprivileged SSD storage subdirectories
  file:
    path: "{{ ssd_storage.root }}/{{ item }}"
    owner: "{{ unprivileged_user.name }}"
    group: "{{ unprivileged_user.group }}"
    state: directory
  loop: "{{ ssd_storage.unprivileged_dirs }}"

- name: Configure configarr directory tree
  file:
    path: "{{ ssd_storage.root }}/configarr/{{ item.path }}"
    owner: "{{ unprivileged_user.name }}"
    group: "{{ unprivileged_user.group }}"
    state: directory
  with_community.general.filetree: "templates/configarr"
  when: item.state == "directory"

- name: Configure configarr
  template:
    src: "{{ item.src }}"
    dest: "{{ ssd_storage.root }}/configarr/{{ item.path }}"
  with_community.general.filetree: "templates/configarr"
  when: item.state == "file"
  notify:
    - Run configarr
