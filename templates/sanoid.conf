{% for dataset in offsite_backup.datasets %}
[{{ dataset }}]
	use_template = offsite

{% endfor %}
[template_offsite]
	frequently = 0
	hourly = 0
	daily = 7
	weekly = 4
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
	# Should happen between the Immich DB dump (2 AM) and the off-site push (3:30)
	daily_hour = 3
	daily_min = 0
	weekly_hour = 3
	weekly_min = 0
